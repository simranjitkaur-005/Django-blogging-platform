<!DOCTYPE html>
<html lang="en">
<head>
    {% load static %}
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/css/bootstrap.min.css" rel="stylesheet">
    
<style>
    body {
        min-height: 100vh;
        display: flex;
        justify-content: center;
        align-items: center;
        font-family: 'Poppins', sans-serif;
        background: linear-gradient(135deg, #ff7e5f, #feb47b, #ff6a88, #8e2de2);
        background-size: 300% 300%;
        animation: sunsetMove 10s ease infinite;
    }

    @keyframes sunsetMove {
        0% { background-position: 0% 50%; }
        50% { background-position: 100% 50%; }
        100% { background-position: 0% 50%; }
    }

    .register-card {
        width: 420px;
        padding: 40px;
        border-radius: 20px;
        background: rgba(255, 255, 255, 0.15);
        backdrop-filter: blur(18px);
        -webkit-backdrop-filter: blur(18px);
        border: 1px solid rgba(255, 255, 255, 0.3);
        box-shadow: 0 8px 32px rgba(0, 0, 0, 0.25);
        color: white;
    }

    .register-card h1 {
        text-align: center;
        margin-bottom: 25px;
        font-weight: 600;
        color: white;
    }

    .form-label {
        font-size: 14px;
        margin-bottom: 5px;
        color: #fff;
    }

    .form-control {
        border-radius: 8px;
        padding: 10px;
        border: none;
        background: rgba(255, 255, 255, 0.2);
        color: white;
    }

    .form-control::placeholder {
        color: rgba(255, 255, 255, 0.7);
    }

    .form-control:focus {
        background: rgba(255, 255, 255, 0.3);
        box-shadow: none;
        color: white;
    }

    .btn-primary {
        border-radius: 8px;
        padding: 10px;
        background: linear-gradient(135deg, #ff6a88, #ff7e5f);
        border: none;
        font-weight: 500;
    }

    .btn-primary:hover {
        opacity: 0.9;
    }

    .bottom-text {
        margin-top: 15px;
        text-align: center;
        font-size: 14px;
        color: white;
    }

    .bottom-text a {
        color: #fff;
        font-weight: 600;
        text-decoration: underline;
    }
    /* Floating Glow Circles */
.bg-bubbles {
    position: absolute;
    width: 100%;
    height: 100%;
    overflow: hidden;
    top: 0;
    left: 0;
    z-index: 0;
}
</style>
</head>

<body>

<form method="POST" class="register-card">
    {% csrf_token %}
    
    <h1>Login</h1>

    <div class="mb-3">
        <label class="form-label">Username</label>
        <input name="email" type="text" class="form-control" placeholder="Enter username">
    </div>

    <div class="mb-3">
        <label class="form-label">Password</label>
        <input name="password" type="password" class="form-control" placeholder="Enter password">
    </div>

    <button type="submit" class="btn btn-primary w-100">Login</button>

    <div class="bottom-text">
        Don’t have an account?
        <a href="{% url 'register' %}">Register</a>
    </div>
</form>

</body>
</html>
